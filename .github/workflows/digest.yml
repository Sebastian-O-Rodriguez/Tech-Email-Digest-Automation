name: Email Digest

on:
  schedule:
    # 9:30 AM America/New_York (Mon-Fri)
    # EDT (Mar-Nov): UTC-4 -> 13:30 UTC
    # EST (Nov-Mar): UTC-5 -> 14:30 UTC
    - cron: '30 13 * * 1-5'   # 9:30 AM EDT
    - cron: '30 14 * * 1-5'   # 9:30 AM EST

    # 12:30 PM America/New_York (Mon-Fri)
    # EDT (Mar-Nov): UTC-4 -> 16:30 UTC
    # EST (Nov-Mar): UTC-5 -> 17:30 UTC
    - cron: '30 16 * * 1-5'   # 12:30 PM EDT
    - cron: '30 17 * * 1-5'   # 12:30 PM EST

  workflow_dispatch: {}  # Manual trigger for testing

concurrency:
  group: email-digest
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  STATE_FILE: state.json
  TZ: America/New_York

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install .

      # DST guard: skip if this cron fired outside the target half-hours.
      # During DST transitions, both cron times fire but only one is correct.
      - name: DST guard
        id: dst
        run: |
          HOUR=$(TZ=America/New_York date +%H)
          MIN=$(TZ=America/New_York date +%M)
          HHMM="${HOUR}${MIN}"
          if [[ "$HHMM" != "0930" && "$HHMM" != "1230" ]]; then
            # Allow a 5-minute window for GH Actions cron drift
            if [[ "$HOUR" == "09" && "$MIN" -ge 25 && "$MIN" -le 35 ]]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
            elif [[ "$HOUR" == "12" && "$MIN" -ge 25 && "$MIN" -le 35 ]]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
            else
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping: current time in America/New_York is ${HOUR}:${MIN}"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore state
        if: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: digest-test-v1

      - name: Run digest pipeline
        if: true
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MAILBOX_USER: ${{ secrets.MAILBOX_USER }}
          TARGET_FOLDER_NAME: ${{ secrets.TARGET_FOLDER_NAME }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m email_ingester

      - name: Save state
        if: true && (success() || failure())
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: digest-test-v1
