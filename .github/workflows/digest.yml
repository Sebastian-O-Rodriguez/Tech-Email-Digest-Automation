name: Email Digest

on:
  schedule:
    # 9:30 AM America/New_York (Mon-Fri)
    - cron: '30 13 * * 1-5'   # 9:30 AM EDT (UTC-4)
    - cron: '30 14 * * 1-5'   # 9:30 AM EST (UTC-5)
    # 12:30 PM America/New_York (Mon-Fri)
    - cron: '30 16 * * 1-5'   # 12:30 PM EDT (UTC-4)
    - cron: '30 17 * * 1-5'   # 12:30 PM EST (UTC-5)

  workflow_dispatch: {}

concurrency:
  group: email-digest
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  STATE_FILE: state.json
  TZ: America/New_York

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install .

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: digest-v17

      - name: Run digest pipeline
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MAILBOX_USER: ${{ secrets.MAILBOX_USER }}
          TARGET_FOLDER_NAME: ${{ secrets.TARGET_FOLDER_NAME }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m email_ingester

      - name: Save state
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.STATE_FILE }}
          key: digest-v17
